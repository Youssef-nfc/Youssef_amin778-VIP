<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bijouterie 925 - بطاقة الأعمال الذكية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:wght@400;600;700&display=swap');

        :root {
            --dark-bg: #0b0b0b;
            --dark-bg-light: #161616;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa820a;
            --cream: #f8f5ee;
            --text-muted: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: #050505;
            display: flex;
            justify-content: center;
            padding: 20px 12px;
            color: var(--cream);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background:
                radial-gradient(circle at 50% 20%, rgba(212,175,55,0.08) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(212,175,55,0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .card {
            background: linear-gradient(180deg, var(--dark-bg) 0%, var(--dark-bg-light) 100%);
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            box-shadow:
                0 25px 60px rgba(0,0,0,0.8),
                0 0 0 1px rgba(212,175,55,0.25) inset,
                0 0 30px rgba(212,175,55,0.08) inset;
            overflow: hidden;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: cardAppear 0.9s ease-out;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .deco-top {
            position: relative;
            height: 60px;
            overflow: hidden;
        }
        .deco-top::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
        }

        .logo-section {
            padding: 10px 20px 15px;
            position: relative;
        }
        .logo-circle {
            width: 100px; height: 100px;
            margin: 0 auto 12px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(212,175,55,0.05);
            box-shadow: 0 0 25px rgba(212,175,55,0.15);
        }
        .logo-circle .crown {
            font-size: 16px;
            color: var(--gold);
            margin-bottom: 2px;
        }
        .logo-circle .num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            font-weight: 700;
            color: var(--gold);
            line-height: 1;
            letter-spacing: 2px;
        }
        .brand-name {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }
        .brand-name .line {
            flex: 1; max-width: 60px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dark));
        }
        .brand-name .line-left {
            background: linear-gradient(90deg, var(--gold-dark), transparent);
        }
        .brand-name span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: var(--gold-light);
            font-weight: 600;
            letter-spacing: 2px;
        }
        .brand-name .diamond {
            color: var(--gold);
            font-size: 0.9rem;
        }
        .brand-ar {
            font-size: 1.2rem;
            color: var(--gold);
            margin-top: 4px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .services {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 0 20px;
            margin: 15px 0 10px;
            flex-wrap: wrap;
        }
        .service-tag {
            background: rgba(212,175,55,0.08);
            border: 1px solid rgba(212,175,55,0.25);
            color: var(--gold-light);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 500;
        }

        .gallery-section {
            margin: 25px 0;
            padding: 0 16px;
        }
        .gallery-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            padding: 0 4px;
        }
        .gallery-header .h-line {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, var(--gold-dark), transparent);
        }
        .gallery-header .h-line-left {
            background: linear-gradient(90deg, transparent, var(--gold-dark));
        }
        .gallery-header-text .main {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            color: var(--gold-light);
            font-weight: 600;
            letter-spacing: 2px;
        }
        .gallery-header-text .sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .hero-slider {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(212,175,55,0.2);
            margin-bottom: 14px;
        }
        .hero-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            touch-action: pan-y;
            cursor: grab;
        }
        .hero-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .hero-slide {
            min-width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            cursor: pointer;
        }
        .hero-slide img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }
        .hero-slide:hover img { transform: scale(1.05); }

        .hero-counter {
            position: absolute;
            top: 14px; right: 14px;
            background: rgba(10,10,10,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212,175,55,0.3);
            color: var(--gold-light);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 2px;
            z-index: 3;
        }
        .hero-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 38px; height: 38px;
            border-radius: 50%;
            background: rgba(10,10,10,0.7);
            border: 1px solid rgba(212,175,55,0.3);
            color: var(--gold-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            transition: all 0.3s ease;
        }
        .hero-arrow.prev { left: 12px; }
        .hero-arrow.next { right: 12px; }

        .thumb-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px 12px;
            scrollbar-width: none;
        }
        .thumb-strip::-webkit-scrollbar { display: none; }
        .thumb {
            flex: 0 0 72px;
            height: 72px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            opacity: 0.6;
        }
        .thumb.active {
            border-color: var(--gold);
            opacity: 1;
            box-shadow: 0 0 12px rgba(212,175,55,0.4);
        }
        .thumb img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .view-all-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(212,175,55,0.08);
            border: 1px solid rgba(212,175,55,0.3);
            color: var(--gold);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s ease;
        }
        .view-all-btn:hover {
            background: rgba(212,175,55,0.2);
            border-color: var(--gold);
        }

        #galleryModal {
            display: none;
            position: fixed;
            z-index: 9998;
            inset: 0;
            background: rgba(5,5,5,0.98);
            backdrop-filter: blur(15px);
            flex-direction: column;
        }
        #galleryModal.open { display: flex; }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .modal-header h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            color: var(--gold-light);
        }
        .modal-close {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.3);
            color: var(--gold);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .modal-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 16px;
        }
        .modal-item {
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(212,175,55,0.15);
        }
        .modal-item img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        #lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
        }
        #lightbox.open { display: flex; }
        #lightbox img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(212,175,55,0.2);
        }
        #lightbox-close {
            position: absolute;
            top: 16px; right: 16px;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.3);
            color: var(--gold);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .action-btns {
            display: flex;
            gap: 12px;
            padding: 0 20px;
            margin: 20px 0;
        }
        .btn {
            flex: 1;
            padding: 14px 10px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
            color: #000;
            box-shadow: 0 6px 20px rgba(212,175,55,0.3);
        }
        .btn-outline {
            background: transparent;
            color: var(--gold);
            border: 1.5px solid var(--gold-dark);
        }

        .info-section { padding: 0 20px; margin-bottom: 20px; }
        .info-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(212,175,55,0.15);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: right;
        }
        .info-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
        }
        .info-label { font-size: 0.72rem; color: var(--text-muted); }
        .info-value { font-size: 0.9rem; color: var(--cream); font-weight: 500; }

        .social-section { padding: 0 20px 25px; }
        .social-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .social-btn {
            aspect-ratio: 1;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1.3rem;
            text-decoration: none;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(212,175,55,0.15);
        }

        .footer-text {
            padding: 15px 20px;
            font-size: 0.7rem;
            color: rgba(212,175,55,0.4);
            text-align: center;
            border-top: 1px solid rgba(212,175,55,0.1);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="deco-top"></div>

        <div class="logo-section">
            <div class="logo-circle">
                <i class="fa-solid fa-crown crown"></i>
                <div class="num">925</div>
            </div>
            <div class="brand-name">
                <div class="line line-left"></div>
                <span>Bijouterie</span>
                <i class="fa-regular fa-gem diamond"></i>
                <div class="line"></div>
            </div>
            <div class="brand-ar">مجوهرات</div>
        </div>

        <div class="services">
            <div class="service-tag">بيع وشراء</div>
            <div class="service-tag">إصلاح المجوهرات</div>
        </div>

        <!-- معرض الصور -->
        <div class="gallery-section">
            <div class="gallery-header">
                <div class="h-line-left"></div>
                <div class="gallery-header-text">
                    <div class="main">GALLERY</div>
                    <div class="sub">معرض الصور</div>
                </div>
                <div class="h-line"></div>
            </div>

            <div class="hero-slider">
                <div class="hero-container" id="heroSlider">
                    <div class="hero-counter" id="heroCounter">01 / 23</div>
                    <div class="hero-track" id="heroTrack"></div>
                </div>
                <button class="hero-arrow prev" onclick="heroGo(current - 1)"><i class="fa-solid fa-chevron-right"></i></button>
                <button class="hero-arrow next" onclick="heroGo(current + 1)"><i class="fa-solid fa-chevron-left"></i></button>
            </div>

            <div class="thumb-strip" id="thumbStrip"></div>

            <button class="view-all-btn" onclick="openGalleryModal()">
                <i class="fa-solid fa-border-all"></i> عرض جميع الصور (23)
            </button>
        </div>

        <div class="action-btns">
            <a href="tel:0678695214" class="btn btn-gold"><i class="fa-solid fa-phone"></i> اتصل بنا</a>
            <a href="https://wa.me/2120678695214" target="_blank" class="btn btn-outline"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
        </div>

        <div class="info-section">
            <div class="info-card">
                <div class="info-icon"><i class="fa-solid fa-location-dot"></i></div>
                <div>
                    <div class="info-label">العنوان</div>
                    <div class="info-value">صحراء مول الركائن، الطابق تحت الأرضي، محل C47</div>
                </div>
            </div>
            <div class="info-card">
                <div class="info-icon"><i class="fa-solid fa-phone"></i></div>
                <div>
                    <div class="info-label">الهاتف</div>
                    <div class="info-value">06 78 69 52 14</div>
                </div>
            </div>
        </div>

        <div class="social-section">
            <div class="social-grid">
                <a href="https://www.instagram.com/Y_bijouterie925" target="_blank" class="social-btn"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.facebook.com/Bijouterie925" target="_blank" class="social-btn"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="https://www.tiktok.com/@bijouterie925" target="_blank" class="social-btn"><i class="fa-brands fa-tiktok"></i></a>
                <a href="mailto:contact@bijouterie925.ma" class="social-btn"><i class="fa-solid fa-envelope"></i></a>
            </div>
        </div>

        <div class="footer-text">© 2026 Bijouterie 925 - جميع الحقوق محفوظة</div>
    </div>

    <div id="galleryModal">
        <div class="modal-header">
            <h3>معرض الصور</h3>
            <button class="modal-close" onclick="closeGalleryModal()">&times;</button>
        </div>
        <div class="modal-grid" id="modalGrid"></div>
    </div>

    <div id="lightbox" onclick="closeLightbox(event)">
        <button id="lightbox-close" onclick="closeLightbox(event)">&times;</button>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        const images = [];
        for (let i = 1; i <= 22; i++) {
            images.push({ full: `ma${i}.jpg`, title: `صورة ${i}` });
        }
        images.push({ full: 'mat1.jpg', title: 'صورة مميزة' });

        const total = images.length;
        let current = 0;

        const heroTrack = document.getElementById('heroTrack');
        const thumbStrip = document.getElementById('thumbStrip');
        const modalGrid = document.getElementById('modalGrid');

        images.forEach((img, i) => {
            // Slide (Lazy Loading)
            const slide = document.createElement('div');
            slide.className = 'hero-slide';
            slide.innerHTML = `<img src="${i === 0 ? img.full : ''}" data-src="${img.full}" loading="lazy" alt="${img.title}">`;
            slide.onclick = () => openLightbox(i);
            heroTrack.appendChild(slide);

            // Thumb (Lazy Loading)
            const thumb = document.createElement('div');
            thumb.className = 'thumb' + (i === 0 ? ' active' : '');
            thumb.innerHTML = `<img src="${i < 5 ? img.full : ''}" data-src="${img.full}" loading="lazy" alt="${img.title}">`;
            thumb.onclick = () => heroGo(i);
            thumbStrip.appendChild(thumb);

            // Modal Item
            const item = document.createElement('div');
            item.className = 'modal-item';
            item.innerHTML = `<img data-src="${img.full}" loading="lazy" alt="${img.title}">`;
            item.onclick = () => openLightbox(i);
            modalGrid.appendChild(item);
        });

        function loadRealImage(imgEl) {
            if (imgEl && imgEl.dataset.src && !imgEl.src) {
                imgEl.src = imgEl.dataset.src;
            }
        }

        function heroGo(index) {
            if (index < 0) index = total - 1;
            if (index >= total) index = 0;
            current = index;
            heroTrack.style.transform = `translateX(${current * 100}%)`;

            // Load next and previous images dynamically
            const slides = heroTrack.querySelectorAll('img');
            loadRealImage(slides[current]);
            if (slides[current + 1]) loadRealImage(slides[current + 1]);
            if (slides[current - 1]) loadRealImage(slides[current - 1]);

            document.querySelectorAll('.thumb').forEach((t, i) => {
                t.classList.toggle('active', i === current);
                if (i === current) loadRealImage(t.querySelector('img'));
            });

            document.getElementById('heroCounter').textContent = String(current + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
        }

        function openGalleryModal() {
            document.getElementById('galleryModal').classList.add('open');
            document.querySelectorAll('#modalGrid img').forEach(img => loadRealImage(img));
        }

        function closeGalleryModal() {
            document.getElementById('galleryModal').classList.remove('open');
        }

        function openLightbox(index) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = images[index].full;
            lightbox.classList.add('open');
        }

        function closeLightbox(e) {
            if (e.target.id === 'lightbox' || e.target.id === 'lightbox-close') {
                document.getElementById('lightbox').classList.remove('open');
            }
        }
    </script>
</body>
</html>
